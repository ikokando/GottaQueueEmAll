# Push a tag like v1.0.0 -> the addon is zipped and uploaded to GitHub Releases,
# and to CurseForge / Wago / WoWInterface once their project IDs are in the .toc
# (X-Curse-Project-ID, X-Wago-ID, X-WoWI-ID) and the CF_API_KEY / WAGO_API_TOKEN /
# WOWI_API_TOKEN secrets are set in the repository settings.
name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
